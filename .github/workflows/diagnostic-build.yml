name: Diagnostic Build

on:
  push:
    branches: [integration/game-recovery]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install --silent --no-audit --no-fund
      - name: Generate Prisma client
        run: npm run db:generate --silent
      - name: Build RPG kernel
        run: npm run build -w packages/rpg-kernel --silent
      - name: Build shared battle package
        run: npm run build -w packages/shared --silent
      - name: Build API with concise diagnostics
        id: api_build
        shell: bash
        run: |
          set +e
          npm run build -w apps/api --silent > api-build.log 2>&1
          status=$?
          cat api-build.log
          exit $status
      - name: Upload API compiler report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-compiler-report
          path: api-build.log
          if-no-files-found: error
          retention-days: 2
      - name: Build web with concise diagnostics
        shell: bash
        run: |
          set +e
          npm run build -w apps/web --silent > web-build.log 2>&1
          status=$?
          cat web-build.log
          exit $status
      - name: Upload web compiler report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-compiler-report
          path: web-build.log
          if-no-files-found: ignore
          retention-days: 2
