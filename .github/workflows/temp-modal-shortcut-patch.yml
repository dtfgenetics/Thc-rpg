name: Temporary Modal Shortcut Patch

on:
  push:
    branches:
      - fix/modal-gameplay-shortcut-guard-20260912
    paths:
      - scripts/apply-modal-shortcut-guard.mjs
      - .github/workflows/temp-modal-shortcut-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply deterministic patch
        run: node scripts/apply-modal-shortcut-guard.mjs
      - name: Commit patched runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/main.js
          git commit -m 'Block gameplay shortcuts behind modal overlays'
          git push origin HEAD:${GITHUB_REF_NAME}
