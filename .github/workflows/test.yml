name: Test

on:
  push:
    branches: [main, "build/**", "feature/**", "fix/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Syntax check browser modules
        run: |
          node --check src/main.js
          node --check src/autosave.js
          node --check src/progression-feedback.js
          node --check src/game/Game.js
          node --check src/game/Plant.js
          node --check src/game/Phenotype.js
          node --check src/game/Environment.js
          node --check src/game/Equipment.js
          node --check src/game/Inventory.js
          node --check src/game/SaveStore.js
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser acceptance
        run: npm run test:e2e
