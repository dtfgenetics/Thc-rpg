name: Test

on:
  push:
    branches: [main, "build/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Syntax check browser modules
        run: |
          node --check src/main.js
          node --check src/game/Game.js
          node --check src/game/Plant.js
          node --check src/game/Inventory.js
