name: Test

on:
  push:
    branches: [main, "build/**", "feature/**", "fix/**", "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Run tests
        run: npm test
      - name: Syntax check browser and release modules
        run: |
          node --check src/main.js
          node --check src/autosave.js
          node --check src/progression-feedback.js
          node --check src/grow-journal-ui.js
          node --check src/game/Game.js
          node --check src/game/Plant.js
          node --check src/game/Phenotype.js
          node --check src/game/Environment.js
          node --check src/game/Equipment.js
          node --check src/game/Inventory.js
          node --check src/game/GrowJournal.js
          node --check src/game/KeeperCuttings.js
          node --check src/game/CampaignChapters.js
          node --check src/game/SaveStore.js
          node --check scripts/build-release.mjs
          node --check scripts/validate-ui-contract.mjs
          node --check scripts/validate-release.mjs
      - name: Validate shipped UI contract
        run: npm run validate:ui
      - name: Build production artifact
        run: npm run build
      - name: Validate production artifact
        run: npm run validate:release
      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: thc-rpg-production-build
          path: dist/
          if-no-files-found: error
