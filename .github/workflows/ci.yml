name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - feature/**
      - integration/**

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: thc_pheno_quest
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d thc_pheno_quest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thc_pheno_quest?schema=public
      PORT: 4000
      NODE_ENV: test
      CORS_ORIGIN: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Run database migrations
        run: npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Validate authoritative game data
        shell: bash
        run: |
          set +e
          npm run data:validate > game-data-validation.log 2>&1
          status=$?
          cat game-data-validation.log
          exit $status

      - name: Upload game data validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: game-data-validation-report
          path: game-data-validation.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Build all packages
        run: npm run build

      - name: Verify complete Growers Grove chapter flow
        shell: bash
        run: |
          set +e
          npm run chapter:verify > chapter-flow-verification.log 2>&1
          status=$?
          cat chapter-flow-verification.log
          exit $status

      - name: Upload chapter flow report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-flow-verification-report
          path: chapter-flow-verification.log
          if-no-files-found: ignore
          retention-days: 2

      - name: Run tests
        run: npm test
