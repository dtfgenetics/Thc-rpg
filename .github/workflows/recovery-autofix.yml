name: Apply Recovery Type Fixes

on:
  push:
    branches: [integration/game-recovery]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/game-recovery
          fetch-depth: 0
      - name: Patch recovery boundaries
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              "apps/api/src/services/battleEngine.ts": [
                  ("      log: initialLog\n", "      log: initialLog as never\n"),
                  (
                      "  const npc = await prisma.npcTemplate.findUniqueOrThrow({ where: { slug: npcSlug } });\n",
                      "  if (npcSlug === DEFAULT_NPC_SLUG) {\n    const chapterUnlock = await prisma.playerUnlock.findUnique({\n      where: { playerId_slug: { playerId, slug: \"quest:clear-resin-wall:claimed\" } }\n    });\n    if (!chapterUnlock) {\n      throw new Error(\"Clear the Resin Wall quest and claim its reward before challenging Ashtray.\");\n    }\n  }\n\n  const npc = await prisma.npcTemplate.findUniqueOrThrow({ where: { slug: npcSlug } });\n"
                  ),
                  (
                      "    await prisma.player.update({\n      where: { id: state.playerId },\n      data: {\n        kushCoin: { increment: rewards.kushCoin },\n        reputation: { increment: rewards.reputation }\n      }\n    });\n\n    for (const combatant of state.playerTeam) {\n",
                      "    await prisma.player.update({\n      where: { id: state.playerId },\n      data: {\n        kushCoin: { increment: rewards.kushCoin },\n        reputation: { increment: rewards.reputation }\n      }\n    });\n\n    await prisma.playerUnlock.upsert({\n      where: { playerId_slug: { playerId: state.playerId, slug: `battle-won:${state.npcSlug}` } },\n      update: { source: `battle:${state.npcSlug}` },\n      create: { playerId: state.playerId, slug: `battle-won:${state.npcSlug}`, source: `battle:${state.npcSlug}` }\n    });\n\n    for (const combatant of state.playerTeam) {\n"
                  ),
              ],
              "apps/api/src/services/inventoryEngine.ts": [
                  ("  const effect = row.item.effectJson as ItemEffect;\n", "  const effect = row.item.effectJson as unknown as ItemEffect;\n"),
              ],
              "apps/api/src/services/progressionEngine.ts": [
                  ("(questTemplate.stepsJson as QuestStepDefinition[])", "(questTemplate.stepsJson as unknown as QuestStepDefinition[])"),
                  ("(recruitEvent.requirementsJson as RecruitRequirement[])", "(recruitEvent.requirementsJson as unknown as RecruitRequirement[])"),
              ],
              "apps/web/app/components/GrowersGroveGame.tsx": [
                  ("  const gameRef = useRef<{ destroy?: (removeCanvas?: boolean) => void } | null>(null);\n", "  const gameRef = useRef<{ destroy: (removeCanvas: boolean, noReturn?: boolean) => void } | null>(null);\n"),
                  (
                      "            this.interactText.setText(nextMessage);\n            setMessage(nextMessage);\n",
                      "            this.interactText.setText(nextMessage);\n            setMessage(nextMessage);\n            if (response.navigateTo) {\n              window.location.assign(response.navigateTo);\n              return;\n            }\n"
                  ),
              ],
              "apps/web/app/games/pheno-quest/page.tsx": [
                  ("import { useMemo, useState } from \"react\";\n", "import { useEffect, useMemo, useState } from \"react\";\n"),
                  (
                      "  const [loading, setLoading] = useState(false);\n\n  const playerActor = useMemo",
                      "  const [loading, setLoading] = useState(false);\n  const [returnTo, setReturnTo] = useState<string | null>(null);\n\n  const playerActor = useMemo"
                  ),
                  (
                      "  const enemyTarget = useMemo(() => (battle ? firstAlive(battle.enemyTeam) : undefined), [battle]);\n\n  async function refreshInventory",
                      "  const enemyTarget = useMemo(() => (battle ? firstAlive(battle.enemyTeam) : undefined), [battle]);\n\n  useEffect(() => {\n    const params = new URLSearchParams(window.location.search);\n    const battleId = params.get(\"battleId\");\n    const playerId = params.get(\"playerId\");\n    const requestedReturn = params.get(\"returnTo\");\n    if (!battleId || !playerId) return;\n\n    setLoading(true);\n    if (requestedReturn?.startsWith(\"/\")) setReturnTo(requestedReturn);\n    Promise.all([\n      api<PlayerSummary>(`/players/${playerId}`),\n      api<InventoryState>(`/inventory/${playerId}`),\n      api<BattleState>(`/battles/${battleId}`)\n    ])\n      .then(([loadedPlayer, loadedInventory, loadedBattle]) => {\n        setPlayer(loadedPlayer);\n        setInventoryState(loadedInventory);\n        setBattle(loadedBattle);\n        setMessage(loadedBattle.status === \"ACTIVE\" ? \"Ashtray battle loaded from Grower’s Grove.\" : `Battle ${loadedBattle.status.toLowerCase()}. Return to the grove.`);\n      })\n      .catch((error) => setMessage(error instanceof Error ? error.message : \"Failed to load the linked battle.\"))\n      .finally(() => setLoading(false));\n  }, []);\n\n  async function refreshInventory"
                  ),
                  (
                      "      setBattle(updatedBattle);\n      setPendingMove(null);\n      setMessage(`${pendingMove.move.name}: ${timing.grade} timing.`);\n",
                      "      setBattle(updatedBattle);\n      setPendingMove(null);\n      if (updatedBattle.status === \"WON\") {\n        setMessage(\"Victory over Ashtray. Return to Grower’s Grove and speak with Nugsworth.\");\n      } else if (updatedBattle.status === \"LOST\") {\n        setMessage(\"Defeat. Return to Grower’s Grove and recover at the Cure Station.\");\n      } else {\n        setMessage(`${pendingMove.move.name}: ${timing.grade} timing.`);\n      }\n"
                  ),
                  (
                      "          <button disabled={!player || loading} onClick={startRivalBattle}>Start Rival Battle</button>\n",
                      "          <button disabled={!player || loading} onClick={startRivalBattle}>Start Rival Battle</button>\n          {battle && battle.status !== \"ACTIVE\" && returnTo && (\n            <button onClick={() => window.location.assign(returnTo)}>Return to Grower’s Grove</button>\n          )}\n"
                  ),
              ],
              "apps/api/src/dataIntegrity.ts": [
                  (
                      "      report(errors, nonEmptyString(item.effectJson.unlockSlug), `Tool ${item.slug} must define unlockSlug.`);\n",
                      "      if (item.effectJson.unlockSlug !== undefined) {\n        report(errors, nonEmptyString(item.effectJson.unlockSlug), `Tool ${item.slug} has an invalid optional unlockSlug.`);\n      }\n"
                  ),
              ],
              "apps/api/prisma/seed.ts": [
                  (
                      "    requirementsJson: [{ type: \"QUEST_CLAIMED\", slug: \"clear-resin-wall\" }],\n",
                      "    requirementsJson: [\n      { type: \"QUEST_CLAIMED\", slug: \"clear-resin-wall\" },\n      { type: \"UNLOCK\", slug: \"battle-won:rival-grower-ashtray\" }\n    ],\n"
                  ),
              ],
          }

          changed = []
          for filename, changes in replacements.items():
              path = Path(filename)
              content = path.read_text()
              original = content
              for old, new in changes:
                  if new in content:
                      continue
                  count = content.count(old)
                  if count != 1:
                      raise SystemExit(f"Expected one match in {filename}, found {count}: {old!r}")
                  content = content.replace(old, new)
              if content != original:
                  path.write_text(content)
                  changed.append(filename)

          Path(".recovery-changed-files").write_text("\n".join(changed))
      - name: Commit fixes
        shell: bash
        run: |
          if [ ! -s .recovery-changed-files ]; then
            echo "No recovery patches required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          xargs git add < .recovery-changed-files
          git commit -m "Complete map-to-battle chapter routing"
          git push origin HEAD:integration/game-recovery
