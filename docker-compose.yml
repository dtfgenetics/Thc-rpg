services:
  postgres:
    image: postgres:16-alpine
    container_name: thc-pheno-quest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: thc_pheno_quest
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thc_pheno_quest"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
